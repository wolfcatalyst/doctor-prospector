name: doctor-prospector

services:
  # === PostgreSQL 16 ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: doctor_prospector
      POSTGRES_USER: ${POSTGRES_USER:-prospector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospector}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prospector} -d doctor_prospector"]
      interval: 5s
      retries: 5

  # === Redis 7 ===
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # === FastAPI Backend ===
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-prospector}:${POSTGRES_PASSWORD:-prospector}@postgres:5432/doctor_prospector
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - source_cache:/app/data/cache
      - export_files:/app/data/exports
      - user_settings:/app/data/profiles
      - feedback:/app/data/feedback
      - ../data/cms_historical:/app/data/cms_historical:ro
      - ../config.yaml:/app/config.yaml:ro
      - ../data/output:/app/data/output:ro
    ports:
      - "${API_PORT:-8400}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # === React Frontend (production: nginx) ===
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3100}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  source_cache:
  export_files:
  user_settings:
  feedback:
